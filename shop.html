<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>متجر المكتبة</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Segoe UI', Tahoma, Arial, sans-serif; background: linear-gradient(135deg, #0f0f1a 0%, #1a1a2e 100%); min-height: 100vh; color: #fff; }
        .header { background: rgba(0, 212, 255, 0.1); padding: 15px 20px; text-align: center; border-bottom: 1px solid rgba(0, 212, 255, 0.3); }
        .header h1 { color: #00d4ff; font-size: 1.5em; }
        .header p { color: #888; font-size: 0.9em; margin-top: 5px; }
        .cart-btn { position: fixed; bottom: 20px; left: 20px; background: #00d4ff; color: #1a1a2e; padding: 15px 25px; border-radius: 50px; font-size: 1.1em; font-weight: bold; cursor: pointer; z-index: 100; box-shadow: 0 5px 20px rgba(0, 212, 255, 0.4); display: none; }
        .cart-btn.show { display: block; }
        .cart-badge { background: #ff4757; color: #fff; padding: 3px 8px; border-radius: 50%; font-size: 0.8em; margin-right: 5px; }
        .container { max-width: 600px; margin: 0 auto; padding: 20px; padding-bottom: 100px; }
        .category-tabs { display: flex; gap: 10px; overflow-x: auto; padding: 10px 0; margin-bottom: 20px; }
        .category-tab { padding: 10px 20px; background: rgba(255, 255, 255, 0.1); border: none; border-radius: 25px; color: #fff; cursor: pointer; white-space: nowrap; font-size: 0.9em; }
        .category-tab.active { background: #00d4ff; color: #1a1a2e; }
        .products-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; }
        .product-card { background: rgba(255, 255, 255, 0.08); border-radius: 12px; overflow: hidden; cursor: pointer; transition: transform 0.3s; }
        .product-card:hover { transform: scale(1.02); }
        .product-img { width: 100%; height: 100px; object-fit: cover; background: rgba(0, 0, 0, 0.3); display: flex; align-items: center; justify-content: center; font-size: 2.5em; }
        .product-info { padding: 10px; }
        .product-name { font-size: 0.95em; font-weight: bold; margin-bottom: 5px; }
        .product-price { color: #00d4ff; font-size: 1em; font-weight: bold; }
        .cart-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.8); z-index: 200; }
        .cart-overlay.show { display: block; }
        .cart-panel { position: fixed; bottom: -100%; left: 0; width: 100%; max-height: 85vh; background: #1a1a2e; border-radius: 20px 20px 0 0; z-index: 300; transition: bottom 0.4s; overflow-y: auto; }
        .cart-panel.show { bottom: 0; }
        .cart-header { padding: 20px; border-bottom: 1px solid #333; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; background: #1a1a2e; }
        .cart-header h3 { color: #00d4ff; }
        .close-btn { background: none; border: none; color: #fff; font-size: 1.5em; cursor: pointer; }
        .cart-items { padding: 20px; }
        .cart-item { display: flex; justify-content: space-between; align-items: center; padding: 15px 0; border-bottom: 1px solid #333; }
        .cart-item-info { flex: 1; }
        .cart-item-name { font-weight: bold; margin-bottom: 5px; }
        .cart-item-price { color: #00d4ff; }
        .cart-item-qty { display: flex; align-items: center; gap: 10px; }
        .qty-btn { width: 30px; height: 30px; background: #00d4ff; color: #1a1a2e; border: none; border-radius: 50%; font-size: 1.2em; cursor: pointer; }
        .cart-empty { text-align: center; padding: 40px; color: #888; }
        .cart-total { padding: 20px; background: rgba(0, 212, 255, 0.1); border-top: 1px solid #333; position: sticky; bottom: 0; }
        .total-row { display: flex; justify-content: space-between; font-size: 1.3em; font-weight: bold; margin-bottom: 15px; }
        .checkout-btn { width: 100%; padding: 15px; background: #00d4ff; color: #1a1a2e; border: none; border-radius: 10px; font-size: 1.1em; font-weight: bold; cursor: pointer; }
        .checkout-form { padding: 20px; display: none; }
        .checkout-form.show { display: block; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; color: #aaa; }
        .form-group input, .form-group select { width: 100%; padding: 12px; background: rgba(0, 0, 0, 0.3); border: 1px solid rgba(255, 255, 255, 0.2); border-radius: 8px; color: #fff; font-size: 1em; }
        .form-group input:focus { outline: none; border-color: #00d4ff; }
        .submit-btn { width: 100%; padding: 15px; background: #2ed573; color: #fff; border: none; border-radius: 10px; font-size: 1.1em; font-weight: bold; cursor: pointer; }
        .success-screen { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #1a1a2e; z-index: 400; justify-content: center; align-items: center; text-align: center; padding: 20px; flex-direction: column; }
        .success-screen.show { display: flex; }
        .success-icon { font-size: 5em; margin-bottom: 20px; }
        .success-code { background: #00d4ff; color: #1a1a2e; padding: 15px 30px; border-radius: 10px; font-size: 1.5em; font-weight: bold; margin: 20px 0; }
        .success-note { color: #888; font-size: 0.9em; margin-top: 15px; }
        .back-btn { margin-top: 20px; padding: 12px 30px; background: rgba(255, 255, 255, 0.1); color: #fff; border: none; border-radius: 8px; cursor: pointer; }
        .toast { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); background: #2ed573; color: #fff; padding: 12px 25px; border-radius: 8px; z-index: 500; animation: fadeIn 0.3s; }
        @keyframes fadeIn { from { opacity: 0; transform: translateX(-50%) translateY(-20px); } to { opacity: 1; transform: translateX(-50%) translateY(0); } }
        .loading { text-align: center; padding: 40px; color: #888; }
        .no-products { text-align: center; padding: 40px; color: #888; }
    </style>
</head>
<body>
    <div class="header">
        <h1>🛒 متجر المكتبة</h1>
        <p>اختر منتجاتك وسنجهزها لك بأسرع وقت</p>
    </div>

    <div class="container">
        <div class="category-tabs" id="categoryTabs"></div>
        <div class="products-grid" id="productsGrid"><div class="loading">جاري التحميل...</div></div>
    </div>

    <div class="cart-btn" id="cartBtn" onclick="openCart()">
        <span class="cart-badge" id="cartBadge">0</span>
        🛒 السلة
    </div>

    <div class="cart-overlay" id="cartOverlay" onclick="closeCart()"></div>

    <div class="cart-panel" id="cartPanel">
        <div class="cart-header">
            <h3>🛒 سلة المشتريات</h3>
            <button class="close-btn" onclick="closeCart()">✖</button>
        </div>

        <div class="cart-items" id="cartItems">
            <div class="cart-empty">السلة فارغة</div>
        </div>

        <div class="cart-total" id="cartTotal" style="display: none;">
            <div class="total-row">
                <span>المجموع:</span>
                <span id="totalAmount">0 IQD</span>
            </div>
            <button class="checkout-btn" onclick="showCheckout()">إتمام الطلب ➡️</button>
        </div>

        <div class="checkout-form" id="checkoutForm">
            <h3 style="margin-bottom: 15px; color: #00d4ff;">📝 بيانات الطلب</h3>
            <div class="form-group">
                <label>اسمك الكامل</label>
                <input type="text" id="customerName" required placeholder="أدخل اسمك">
            </div>
            <div class="form-group">
                <label>رقم الهاتف</label>
                <input type="tel" id="customerPhone" required placeholder="07XX XXX XXXX">
            </div>
            <div class="form-group">
                <label>طريقة الاستلام</label>
                <select id="deliveryPoint">
                    <option value="استلام من المكتبة">🏪 استلام من المكتبة</option>
                    <option value="توصيل">📦 توصيل للمنزل (+1000 IQD)</option>
                </select>
            </div>
            <button class="submit-btn" onclick="submitOrder()">🎯 تأكيد الحجز</button>
        </div>
    </div>

    <div class="success-screen" id="successScreen">
        <div class="success-icon">✅</div>
        <h2>تم استلام طلبك بنجاح!</h2>
        <p>كود الطلب الخاص بك:</p>
        <div class="success-code" id="orderCode">------</div>
        <p>أرسل هذا الكود للبوت لتأكيد طلبك</p>
        <button class="back-btn" onclick="copyCode()">📋 نسخ الكود</button>
        <button class="back-btn" onclick="resetCart()">🔄 طلب جديد</button>
    </div>

    <script>
        // ====== Supabase ======
        const SUPABASE_URL = 'https://lviwphjyjzabkflbhvge.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imx2aXdwaGp5anphYmtmbGJodmdlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NDk0ODQzMTIsImV4cCI6MjA2NTA2MDMxMn0.iNOYhuAUJppAJNf0HABXwA_L_XUWRqn';

        const { createClient } = window.supabase;
        const supabase = createClient(SUPABASE_URL, SUPABASE_KEY);

        let products = [];
        let cart = [];
        let currentCategory = 'الكل';
        let orderCode = '';

        // ====== تحميل المنتجات من Supabase ======
        async function loadProductsFromDB() {
            const grid = document.getElementById('productsGrid');
            grid.innerHTML = '<div class="loading">جاري التحميل...</div>';

            const { data, error } = await supabase
                .from('products')
                .select('*')
                .order('created_at', { ascending: false });

            if (error) {
                grid.innerHTML = '<div class="no-products">خطأ في التحميل</div>';
                return;
            }

            products = data || [];
            loadCategories();
            renderProducts();
        }

        function loadCategories() {
            const categories = ['الكل', ...new Set(products.map(p => p.category || 'أخرى'))];
            const catIcons = { 'الكل': '📦', 'كتب': '📚', 'قرطاسيات': '✏️', 'طباعة': '🖨', 'أخرى': '📦' };
            const tabs = document.getElementById('categoryTabs');
            tabs.innerHTML = categories.map(cat => `
                <button class="category-tab ${cat === currentCategory ? 'active' : ''}" onclick="filterCategory('${cat}')">
                    ${catIcons[cat] || '📦'} ${cat}
                </button>
            `).join('');
        }

        function filterCategory(cat) {
            currentCategory = cat;
            loadCategories();
            renderProducts();
        }

        function renderProducts() {
            const filtered = currentCategory === 'الكل' ? products : products.filter(p => (p.category || 'أخرى') === currentCategory);
            const grid = document.getElementById('productsGrid');

            if (filtered.length === 0) {
                grid.innerHTML = '<div class="no-products">لا توجد منتجات حالياً</div>';
                return;
            }

            grid.innerHTML = filtered.map(p => `
                <div class="product-card" onclick="addToCart(${p.id})">
                    <div class="product-img">📦</div>
                    <div class="product-info">
                        <div class="product-name">${p.name}</div>
                        <div class="product-price">${p.price.toLocaleString()} IQD</div>
                    </div>
                </div>
            `).join('');
        }

        function addToCart(productId) {
            const product = products.find(p => p.id === productId);
            const existing = cart.find(item => item.id === productId);
            if (existing) { existing.qty++; }
            else { cart.push({ id: product.id, name: product.name, price: product.price, qty: 1 }); }
            updateCartUI();
            showToast('✅ تم إضافة للسلة');
        }

        function updateCartUI() {
            const totalItems = cart.reduce((sum, item) => sum + item.qty, 0);
            const totalPrice = cart.reduce((sum, item) => sum + (item.price * item.qty), 0);
            document.getElementById('cartBadge').textContent = totalItems;
            document.getElementById('cartBtn').classList.toggle('show', totalItems > 0);

            const itemsEl = document.getElementById('cartItems');
            const totalEl = document.getElementById('cartTotal');

            if (cart.length === 0) {
                itemsEl.innerHTML = '<div class="cart-empty">السلة فارغة</div>';
                totalEl.style.display = 'none';
            } else {
                itemsEl.innerHTML = cart.map(item => `
                    <div class="cart-item">
                        <div class="cart-item-info">
                            <div class="cart-item-name">${item.name}</div>
                            <div class="cart-item-price">${(item.price * item.qty).toLocaleString()} IQD</div>
                        </div>
                        <div class="cart-item-qty">
                            <button class="qty-btn" onclick="decreaseQty(${item.id})">-</button>
                            <span>${item.qty}</span>
                            <button class="qty-btn" onclick="increaseQty(${item.id})">+</button>
                        </div>
                    </div>
                `).join('');
                document.getElementById('totalAmount').textContent = totalPrice.toLocaleString() + ' IQD';
                totalEl.style.display = 'block';
            }
        }

        function increaseQty(id) { const item = cart.find(i => i.id === id); if (item) { item.qty++; updateCartUI(); } }
        function decreaseQty(id) { const item = cart.find(i => i.id === id); if (item) { item.qty--; if (item.qty <= 0) cart = cart.filter(i => i.id !== id); updateCartUI(); } }
        function openCart() { document.getElementById('cartOverlay').classList.add('show'); document.getElementById('cartPanel').classList.add('show'); document.getElementById('checkoutForm').classList.remove('show'); }
        function closeCart() { document.getElementById('cartOverlay').classList.remove('show'); document.getElementById('cartPanel').classList.remove('show'); }
        function showCheckout() { document.getElementById('checkoutForm').classList.add('show'); }

        function generateCode() { return Math.random().toString(36).substring(2, 8).toUpperCase(); }

        async function submitOrder() {
            const name = document.getElementById('customerName').value.trim();
            const phone = document.getElementById('customerPhone').value.trim();
            const delivery = document.getElementById('deliveryPoint').value;

            if (!name || !phone) { showToast('⚠️ ملء الحقول'); return; }

            orderCode = generateCode();
            const deliveryCost = delivery.includes('توصيل') ? 1000 : 0;
            const total = cart.reduce((sum, item) => sum + (item.price * item.qty), 0) + deliveryCost;

            // حفظ الطلب في Supabase
            const { error } = await supabase.from('orders').insert({
                code: orderCode,
                customer_name: name,
                customer_phone: phone,
                delivery_point: delivery,
                items: cart,
                total: total,
                status: 'pending'
            });

            if (error) {
                showToast('❌ خطأ: ' + error.message);
                return;
            }

            document.getElementById('orderCode').textContent = orderCode;
            document.getElementById('successScreen').classList.add('show');
            closeCart();
        }

        function copyCode() { navigator.clipboard.writeText(orderCode); showToast('✅ تم نسخ الكود!'); }
        function resetCart() { cart = []; updateCartUI(); document.getElementById('successScreen').classList.remove('show'); document.getElementById('checkoutForm').classList.remove('show'); document.getElementById('customerName').value = ''; document.getElementById('customerPhone').value = ''; }
        function showToast(msg) { const toast = document.createElement('div'); toast.className = 'toast'; toast.textContent = msg; document.body.appendChild(toast); setTimeout(() => toast.remove(), 2000); }

        // ====== تشغيل ======
        loadProductsFromDB();
    </script>
</body>
</html>
