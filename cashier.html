<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نظام الكاشير - إدارة المنتجات</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- Vercel Speed Insights -->
    <script>
        window.si = window.si || function () { (window.siq = window.siq || []).push(arguments); };
    </script>
    <script defer src="/_vercel/speed-insights/script.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Segoe UI', Tahoma, Arial, sans-serif; background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%); min-height: 100vh; color: #fff; }
        .container { max-width: 1200px; margin: 0 auto; padding: 20px; }
        header { background: rgba(255, 255, 255, 0.1); backdrop-filter: blur(10px); padding: 20px; border-radius: 15px; margin-bottom: 30px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 15px; }
        h1 { font-size: 1.8em; color: #00d4ff; }
        .url-box { background: rgba(0, 212, 255, 0.2); padding: 10px 15px; border-radius: 8px; font-size: 0.9em; }
        .url-box strong { color: #00d4ff; }
        .tabs { display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; }
        .tab-btn { padding: 12px 25px; background: rgba(255, 255, 255, 0.1); border: none; border-radius: 8px; color: #fff; cursor: pointer; font-size: 1em; transition: all 0.3s; }
        .tab-btn:hover, .tab-btn.active { background: #00d4ff; color: #1a1a2e; }
        .tab-content { display: none; background: rgba(255, 255, 255, 0.05); padding: 25px; border-radius: 15px; }
        .tab-content.active { display: block; }
        .card { background: rgba(255, 255, 255, 0.08); padding: 20px; border-radius: 12px; margin-bottom: 20px; }
        .card h3 { margin-bottom: 15px; color: #00d4ff; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; color: #aaa; }
        .form-group input, .form-group textarea, .form-group select { width: 100%; padding: 12px; background: rgba(0, 0, 0, 0.3); border: 1px solid rgba(255, 255, 255, 0.2); border-radius: 8px; color: #fff; font-size: 1em; }
        .form-group input:focus { outline: none; border-color: #00d4ff; }
        .btn { padding: 12px 25px; background: #00d4ff; color: #1a1a2e; border: none; border-radius: 8px; cursor: pointer; font-size: 1em; font-weight: bold; }
        .btn:hover { background: #00b8e6; }
        .btn-danger { background: #ff4757; }
        .btn-success { background: #2ed573; }
        .products-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 20px; }
        .product-card { background: rgba(255, 255, 255, 0.1); border-radius: 12px; overflow: hidden; transition: transform 0.3s; }
        .product-card:hover { transform: translateY(-5px); }
        .product-img { width: 100%; height: 150px; object-fit: cover; background: rgba(0, 0, 0, 0.3); display: flex; align-items: center; justify-content: center; font-size: 3em; }
        .product-info { padding: 15px; }
        .product-name { font-size: 1.1em; font-weight: bold; margin-bottom: 5px; }
        .product-price { color: #00d4ff; font-size: 1.2em; font-weight: bold; }
        .product-actions { display: flex; gap: 10px; padding: 15px; padding-top: 0; }
        .product-actions button { flex: 1; padding: 8px; border: none; border-radius: 6px; cursor: pointer; font-size: 0.9em; }
        .stats-cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin-bottom: 20px; }
        .stat-card { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); padding: 20px; border-radius: 12px; text-align: center; }
        .stat-card.green { background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%); }
        .stat-card.orange { background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%); }
        .stat-card h4 { font-size: 0.9em; color: rgba(255, 255, 255, 0.8); margin-bottom: 10px; }
        .stat-card .value { font-size: 2em; font-weight: bold; }
        .orders-list { max-height: 500px; overflow-y: auto; }
        .order-item { background: rgba(255, 255, 255, 0.05); padding: 15px; border-radius: 8px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; }
        .order-code { background: #00d4ff; color: #1a1a2e; padding: 5px 10px; border-radius: 5px; font-weight: bold; }
        .order-details { flex: 1; min-width: 200px; }
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.8); z-index: 1000; justify-content: center; align-items: center; }
        .modal.show { display: flex; }
        .modal-content { background: #1a1a2e; padding: 25px; border-radius: 15px; max-width: 500px; width: 90%; max-height: 80vh; overflow-y: auto; }
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .modal-close { background: none; border: none; color: #fff; font-size: 1.5em; cursor: pointer; }
        .toast { position: fixed; bottom: 20px; right: 20px; background: #2ed573; color: #fff; padding: 15px 25px; border-radius: 8px; z-index: 2000; animation: slideIn 0.3s; }
        @keyframes slideIn { from { transform: translateX(100%); } to { transform: translateX(0); } }
        .loading { text-align: center; padding: 40px; color: #888; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>💰 نظام الكاشير</h1>
            <div class="url-box">
                <strong>رابط المتجر:</strong>
                <span id="shopUrl">جاري التحميل...</span>
            </div>
        </header>

        <div class="tabs">
            <button class="tab-btn active" onclick="showTab('products')">📦 المنتجات</button>
            <button class="tab-btn" onclick="showTab('orders')">📋 الطلبات</button>
            <button class="tab-btn" onclick="showTab('stats')">📊 الإحصائيات</button>
        </div>

        <div id="products" class="tab-content active">
            <div class="card">
                <h3>➕ إضافة منتج جديد</h3>
                <form id="productForm">
                    <div class="form-group">
                        <label>اسم المنتج</label>
                        <input type="text" id="productName" required placeholder="مثال: كتاب الرياضيات">
                    </div>
                    <div class="form-group">
                        <label>السعر (دينار)</label>
                        <input type="number" id="productPrice" required placeholder="1000">
                    </div>
                    <div class="form-group">
                        <label>الوصف</label>
                        <textarea id="productDesc" rows="2" placeholder="وصف المنتج"></textarea>
                    </div>
                    <div class="form-group">
                        <label>التصنيف</label>
                        <select id="productCategory">
                            <option value="كتب">📚 كتب</option>
                            <option value="قرطاسيات">✏️ قرطاسيات</option>
                            <option value="طباعة">🖨 طباعة</option>
                            <option value="أخرى">📦 أخرى</option>
                        </select>
                    </div>
                    <button type="submit" class="btn">💾 حفظ المنتج</button>
                </form>
            </div>
            <h3 style="margin-bottom: 15px;">📦 المنتجات الحالية</h3>
            <div id="productsList" class="products-grid"></div>
        </div>

        <div id="orders" class="tab-content">
            <div id="ordersList" class="orders-list"></div>
        </div>

        <div id="stats" class="tab-content">
            <div class="stats-cards">
                <div class="stat-card">
                    <h4>إجمالي المبيعات</h4>
                    <div class="value" id="totalSales">0</div>
                    <span>IQD</span>
                </div>
                <div class="stat-card green">
                    <h4>الطلبات المكتملة</h4>
                    <div class="value" id="totalOrders">0</div>
                    <span>طلب</span>
                </div>
                <div class="stat-card orange">
                    <h4>المنتجات</h4>
                    <div class="value" id="totalProducts">0</div>
                    <span>منتج</span>
                </div>
            </div>
        </div>
    </div>

    <div id="orderModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>📋 تفاصيل الطلب</h3>
                <button class="modal-close" onclick="closeModal()">✖</button>
            </div>
            <div id="orderDetails"></div>
        </div>
    </div>

    <script>
        // ====== إعدادات Supabase ======
        const SUPABASE_URL = 'https://lviwphjyjzabkflbhvge.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imx2aXdwaGp5anphYmtmbGJodmdlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NDk0ODQzMTIsImV4cCI6MjA2NTA2MDMxMn0.iNOYhuAUJppAJNf0HABXwA_L_XUWRqn';

        const { createClient } = window.supabase;
        const supabase = createClient(SUPABASE_URL, SUPABASE_KEY);

        // ====== تحميل المنتجات ======
        async function loadProducts() {
            const grid = document.getElementById('productsList');
            grid.innerHTML = '<div class="loading">جاري التحميل...</div>';

            const { data, error } = await supabase
                .from('products')
                .select('*')
                .order('created_at', { ascending: false });

            if (error) {
                grid.innerHTML = '<p style="color:#ff4757;">خطأ في التحميل</p>';
                return;
            }

            if (!data || data.length === 0) {
                grid.innerHTML = '<p style="text-align: center; color: #888; grid-column: 1/-1;">لا توجد منتجات. أضف منتجك الأول!</p>';
                return;
            }

            grid.innerHTML = data.map(p => `
                <div class="product-card">
                    <div class="product-img">📦</div>
                    <div class="product-info">
                        <div class="product-name">${p.name}</div>
                        <div class="product-price">${p.price.toLocaleString()} IQD</div>
                        <div style="color:#888;font-size:0.85em;">${p.category || 'أخرى'}</div>
                    </div>
                    <div class="product-actions">
                        <button class="btn-danger" onclick="deleteProduct(${p.id})">🗑 حذف</button>
                    </div>
                </div>
            `).join('');
        }

        // ====== إضافة منتج ======
        document.getElementById('productForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const name = document.getElementById('productName').value.trim();
            const price = parseInt(document.getElementById('productPrice').value);
            const desc = document.getElementById('productDesc').value.trim();
            const category = document.getElementById('productCategory').value;

            const { error } = await supabase.from('products').insert({
                name, price, category, description: desc
            });

            if (error) {
                showToast('❌ خطأ: ' + error.message);
                return;
            }

            showToast('✅ تم إضافة المنتج!');
            this.reset();
            loadProducts();
        });

        // ====== حذف منتج ======
        async function deleteProduct(id) {
            if (!confirm('هل تريد حذف هذا المنتج؟')) return;

            const { error } = await supabase.from('products').delete().eq('id', id);
            if (error) {
                showToast('❌ خطأ في الحذف');
                return;
            }
            showToast('🗑 تم الحذف');
            loadProducts();
        }

        // ====== الطلبات ======
        async function loadOrders() {
            const list = document.getElementById('ordersList');
            list.innerHTML = '<div class="loading">جاري التحميل...</div>';

            const { data, error } = await supabase
                .from('orders')
                .select('*')
                .order('created_at', { ascending: false });

            if (error) {
                list.innerHTML = '<p style="color:#ff4757;">خطأ في التحميل</p>';
                return;
            }

            if (!data || data.length === 0) {
                list.innerHTML = '<p style="text-align: center; color: #888;">لا توجد طلبات حالياً</p>';
                return;
            }

            const pending = data.filter(o => o.status === 'pending');
            const completed = data.filter(o => o.status === 'completed');

            let html = '';
            if (pending.length > 0) {
                html += '<h4 style="color:#00d4ff;margin-bottom:10px;">⏳ طلبات جديدة</h4>';
                pending.forEach(o => {
                    html += `
                        <div class="order-item">
                            <span class="order-code">${o.code}</span>
                            <div class="order-details">
                                <strong>${o.customer_name}</strong><br>
                                <small style="color:#888;">${o.customer_phone}</small>
                            </div>
                            <div>
                                <button class="btn btn-success" onclick="markComplete('${o.code}')">✅ تأكيد</button>
                            </div>
                        </div>
                    `;
                });
            }

            if (completed.length > 0) {
                html += '<h4 style="color:#2ed573;margin:20px 0 10px;">✅ طلبات مكتملة</h4>';
                completed.forEach(o => {
                    html += `
                        <div class="order-item" style="opacity:0.7;">
                            <span class="order-code">${o.code}</span>
                            <div class="order-details">
                                <strong>${o.customer_name}</strong>
                            </div>
                            <span style="color:#2ed573;">✓</span>
                        </div>
                    `;
                });
            }

            list.innerHTML = html;
        }

        async function markComplete(code) {
            const { error } = await supabase
                .from('orders')
                .update({ status: 'completed' })
                .eq('code', code);

            if (error) {
                showToast('❌ خطأ');
                return;
            }
            showToast('✅ تم التأكيد!');
            loadOrders();
        }

        // ====== الإحصائيات ======
        async function loadStats() {
            const { data: products } = await supabase.from('products').select('id');
            const { data: orders } = await supabase.from('orders').select('*');

            const completed = orders.filter(o => o.status === 'completed');
            const total = completed.reduce((sum, o) => sum + (o.total || 0), 0);

            document.getElementById('totalSales').textContent = total.toLocaleString();
            document.getElementById('totalOrders').textContent = completed.length;
            document.getElementById('totalProducts').textContent = products?.length || 0;
        }

        // ====== مساعدة ======
        function showTab(tab) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
            document.getElementById(tab).classList.add('active');
            event.target.classList.add('active');

            if (tab === 'orders') loadOrders();
            if (tab === 'stats') loadStats();
        }

        function closeModal() { document.getElementById('orderModal').classList.remove('show'); }

        function showToast(msg) {
            const toast = document.createElement('div');
            toast.className = 'toast';
            toast.textContent = msg;
            document.body.appendChild(toast);
            setTimeout(() => toast.remove(), 3000);
        }

        function updateShopUrl() {
            const loc = window.location;
            document.getElementById('shopUrl').textContent = loc.protocol + '//' + loc.host + loc.pathname.replace('cashier.html', 'shop.html');
        }

        // ====== تشغيل ======
        loadProducts();
        updateShopUrl();
    </script>
</body>
</html>
